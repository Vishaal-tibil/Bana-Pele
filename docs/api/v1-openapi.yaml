openapi: 3.0.3
info:
  title: Naledi Network API (v1)
  version: "1.0.0"
  description: |
    The REST API the Bana Pele partner backend (My Journey) uses to reach the
    Beckn network. It is served by **sandbox-bap** and exposed to the internet
    only through **naledi-edge**, which forwards `/v1/*` and nothing else.

    Every call except `GET /v1/health` needs the header `X-Api-Key`. All
    bodies are JSON. The flow, the events we push to you and the button
    mapping are described in `docs/PARTNER-CONTRACT.md`; this file is the
    exact request/response reference.

    **Asynchronous by design.** Calls that send a Beckn message (`search`,
    `select`, `confirm`) return `202` straight away. The answer arrives a moment
    later: poll `GET /v1/status/{transactionId}` or listen for the events.
servers:
  - url: https://{edgeHost}
    description: naledi-edge (sandbox). The address is sent to you privately.
    variables:
      edgeHost:
        default: sandbox.example.invalid
  - url: http://localhost:3010
    description: Local run (start.sh)
security:
  - ApiKey: []
tags:
  - name: Practitioner side
    description: Calls made on behalf of Naledi (the practitioner)
  - name: Provider side
    description: Calls made on behalf of the provider (e.g. WeHelp)
  - name: Read
  - name: Operations

paths:
  /v1/search:
    post:
      tags: [Practitioner side]
      summary: Start a search when a practitioner signs up
      description: Sends a Beckn `discover` into the network with the fields the practitioner agreed to share.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example: { practitionerId: prac_naledi_mahlangu, needType: registration, region: Alexandra, tier: Pre-Bronze, children: 28 }
      responses:
        '202':
          description: Search sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId: { type: string, format: uuid }
                  status: { type: string, enum: [searching] }
                  epoch: { type: integer }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/NetworkRejected' }

  /v1/results/{transactionId}:
    get:
      tags: [Read]
      summary: Providers found and offers received for a search
      parameters: [ { $ref: '#/components/parameters/TransactionId' } ]
      responses:
        '200':
          description: Results so far
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId: { type: string }
                  status: { $ref: '#/components/schemas/Status' }
                  results: { type: array, items: { $ref: '#/components/schemas/ProviderResult' } }
                  offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownTransaction' }

  /v1/status/{transactionId}:
    get:
      tags: [Read]
      summary: Current status of the whole transaction
      parameters: [ { $ref: '#/components/parameters/TransactionId' } ]
      responses:
        '200':
          description: Status and details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownTransaction' }

  /v1/log/{transactionId}:
    get:
      tags: [Read]
      summary: The transaction's full log, both sides, in time order
      description: |
        Every Beckn message in and out (`beckn.out`, `beckn.in`, `beckn.ack`),
        every state change (`tx.state`, `need.status_changed`, ...), every
        event pushed to you and every API call, from sandbox-bap and
        sandbox-bpp. Read from the database, so it survives restarts.
        Meant for support and debugging, not for driving your screens.
      parameters: [ { $ref: '#/components/parameters/TransactionId' } ]
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownTransaction' }

  /v1/select:
    post:
      tags: [Practitioner side]
      summary: The practitioner accepts an offer (requests the provider)
      description: Sends Beckn `select` then `init`. Repeating it for the same provider is safe (200, `idempotent`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, practitionerId, needType, providerId]
              properties:
                transactionId: { type: string }
                practitionerId: { type: string }
                needType: { $ref: '#/components/schemas/NeedType' }
                providerId: { type: string, example: provider-wehelp }
      responses:
        '202': { description: Request sent, content: { application/json: { schema: { type: object, properties: { transactionId: { type: string }, status: { type: string, enum: [pending] } } } } } }
        '200': { $ref: '#/components/responses/Idempotent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/NetworkRejected' }

  /v1/confirm:
    post:
      tags: [Practitioner side]
      summary: The practitioner confirms the support was delivered
      description: Needs a reserved request. Sends Beckn `confirm`. Repeating it is safe (200, `idempotent`). The `note` stays in our record and does not travel through the network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string }
                practitionerId: { type: string }
                needType: { $ref: '#/components/schemas/NeedType' }
                providerId: { type: string }
                note: { type: string }
      responses:
        '202': { description: Confirm sent, content: { application/json: { schema: { type: object, properties: { transactionId: { type: string }, status: { type: string, enum: [confirming] } } } } } }
        '200': { $ref: '#/components/responses/Idempotent' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/NetworkRejected' }

  /v1/provider/offer:
    post:
      tags: [Provider side]
      summary: The provider sends an offer to the practitioner
      description: Sent back as a second answer on the practitioner's search. Send your own `offerId` and match the `offer.received` event with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, providerId, title]
              properties:
                transactionId: { type: string }
                providerId: { type: string, example: provider-wehelp }
                title: { type: string }
                area: { type: string }
                note: { type: string }
                offerId: { type: string, description: Your own id. Generated if missing. }
                providerName: { type: string }
      responses:
        '200': { description: Offer sent, content: { application/json: { schema: { type: object, properties: { offerId: { type: string }, status: { type: string, enum: [sent] } } } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnknownTransaction' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/NetworkRejected' }

  /v1/provider/decision:
    post:
      tags: [Provider side]
      summary: The provider accepts or declines a request (and assigns a coach)
      description: Waits up to 4 seconds for the request to arrive if you answer very quickly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string }
                decision: { type: string, enum: [accept, decline], default: accept }
                coachId: { type: string, example: coach_thabo_nkosi }
      responses:
        '200': { $ref: '#/components/responses/DecisionDone' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: no_pending_request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/provider/complete:
    post:
      tags: [Provider side]
      summary: The provider marks the support delivered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string }
                decision: { type: string, enum: [accept, decline], default: accept }
      responses:
        '200': { $ref: '#/components/responses/DecisionDone' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: no_pending_request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/admin/reset:
    post:
      tags: [Operations]
      summary: Wipe both sides' state before a rehearsal
      description: Increases `epoch`. When you see a new epoch in an event, drop the network state you hold. The persistent log is kept.
      responses:
        '200': { description: Reset, content: { application/json: { schema: { type: object, properties: { epoch: { type: integer }, providerSide: { type: string, example: ok } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/health:
    get:
      tags: [Operations]
      summary: Liveness (no key needed)
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  epoch: { type: integer }
                  eventsConfigured: { type: boolean }
                  outboxPending: { type: integer }
                  transactions: { type: integer }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Sent to you privately. We send the same header when we call your /network/* endpoints.
  parameters:
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Returned by POST /v1/search. Keep it on the practitioner's record.
  schemas:
    NeedType:
      type: string
      description: The ten need types the network understands.
      enum: [registration, infrastructure, learning-skilling, health-safety, nutrition, child-development, starter-kit, capability-development, fundraising, peer-guidance]
    Status:
      type: string
      description: |
        searching, results_ready, pending (waiting for the provider), reserved (provider accepted),
        confirming, fulfilled, rejected (declined, or the need was already taken),
        error (the network refused the message).
      enum: [searching, results_ready, pending, reserved, confirming, fulfilled, rejected, error]
    SearchRequest:
      type: object
      required: [practitionerId, needType]
      properties:
        practitionerId: { type: string, description: Your own id for the practitioner }
        needType: { $ref: '#/components/schemas/NeedType' }
        region: { type: string, example: Alexandra }
        tier: { type: string, example: Pre-Bronze }
        children: { type: integer, example: 28 }
    ProviderResult:
      type: object
      properties:
        providerId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [NGO, Thabo] }
        description: { type: string }
        region: { type: string }
        reasons: { type: array, items: { type: string } }
    Offer:
      type: object
      properties:
        offerId: { type: string }
        title: { type: string }
        area: { type: string }
        note: { type: string }
        providerId: { type: string }
        providerName: { type: string }
        receivedAt: { type: string, format: date-time }
    TransactionStatus:
      type: object
      properties:
        transactionId: { type: string }
        practitionerId: { type: string }
        needType: { $ref: '#/components/schemas/NeedType' }
        status: { $ref: '#/components/schemas/Status' }
        order:
          type: object
          properties:
            status: { type: string, description: "none until a provider is requested, then the order's status" }
            needId: { type: string, nullable: true }
            providerId: { type: string, nullable: true }
        resultsCount: { type: integer }
        offersCount: { type: integer }
        createdAt: { type: string, format: date-time }
        results: { type: array, items: { $ref: '#/components/schemas/ProviderResult' } }
        offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
        epoch: { type: integer }
    LogEntry:
      type: object
      required: [at, service, level, event]
      properties:
        at: { type: string, format: date-time }
        service: { type: string, enum: [sandbox-bap, sandbox-bpp] }
        level: { type: string, enum: [debug, info, warn, error] }
        event: { type: string, example: beckn.out }
        transactionId: { type: string }
        messageId: { type: string }
        action: { type: string, example: discover }
        direction: { type: string, enum: [in, out] }
        body: { description: 'The Beckn message (for beckn.in and beckn.out)' }
      additionalProperties: true
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        detail: { type: string }
  responses:
    InvalidRequest:
      description: invalid_request (a required field is missing, or the body is not JSON)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: unauthorized (missing or wrong X-Api-Key)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnknownTransaction:
      description: unknown_transaction
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: already_in_progress, not_reserved, provider_not_matched or request_not_ready (the step is not allowed right now)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NetworkRejected:
      description: network_rejected (the network refused the message; `detail` says why)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Idempotent:
      description: Already done for this transaction (safe repeat)
      content:
        application/json:
          schema:
            type: object
            properties:
              transactionId: { type: string }
              status: { type: string }
              idempotent: { type: boolean, enum: [true] }
    DecisionDone:
      description: Decision applied
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
              decision: { type: string }
              stage: { type: string, enum: [init, confirm] }
              needId: { type: string }
              needStatus: { type: string, enum: [open, reserved, fulfilled] }
